name: Build Minimal FFmpeg WASM Core

on:
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 配置 Emscripten WebAssembly 编译器
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.44'

      # 2. 下载 FFmpeg 源码
      - name: Download FFmpeg Source
        run: |
          git clone --depth 1 -b n6.0 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src

      # 3. 极简裁剪配置与自动链接生成 ffmpeg-core
      - name: Build Minimal Core
        run: |
          cd ffmpeg-src

          # 传递 Emscripten 导出参数直接让 FFmpeg 构建系统生成 .js 和 .wasm
          emconfigure ./configure \
            --target-os=none \
            --arch=x86_32 \
            --enable-cross-compile \
            --disable-x86asm \
            --disable-inline-asm \
            --disable-doc \
            --disable-all \
            --enable-avcodec \
            --enable-avformat \
            --enable-avutil \
            --enable-swscale \
            --enable-swresample \
            --enable-demuxer=mpegts,mov,mp4,image2 \
            --enable-muxer=mp4,image2 \
            --enable-decoder=h264,hevc,aac \
            --enable-encoder=mjpeg,aac \
            --enable-protocol=file \
            --enable-filter=scale \
            --extra-cflags="-O3" \
            --extra-ldflags="-s WASM=1 -s ALLOW_MEMORY_GROWTH=1 -s EXPORT_ES6=1 -s MODULARIZE=1 -s INVOKE_RUN=0 -s EXIT_RUNTIME=1 -s EXPORTED_RUNTIME_METHODS=['FS','callMain','stringToUTF8','UTF8ToString','cwrap','getValue','setValue']"

          # 编译 ffmpeg
          emmake make -j$(nproc)

          # 提取构建出的 ffmpeg.js / ffmpeg.wasm 并重命名为标准 core 产物
          mkdir -p ../dist
          cp ffmpeg.js ../dist/ffmpeg-core.js
          cp ffmpeg.wasm ../dist/ffmpeg-core.wasm

      # 4. 打包产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-core-mini
          path: dist/
