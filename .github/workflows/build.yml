name: Build Minimal FFmpeg WASM Core

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. 配置 Emscripten 编译器
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.44'

      # 2. 下载 FFmpeg 源码
      - name: Download FFmpeg Source
        run: |
          git clone --depth 1 -b n6.0 https://github.com/FFmpeg/FFmpeg.git ffmpeg-src

      # 3. 极简裁剪编译并链接
      - name: Build Minimal Core
        run: |
          cd ffmpeg-src

          # 步骤 A: 极简轻量配置
          emconfigure ./configure \
            --cc="emcc" \
            --cxx="em++" \
            --ar="emar" \
            --ranlib="emranlib" \
            --target-os=none \
            --arch=x86_32 \
            --enable-cross-compile \
            --disable-x86asm \
            --disable-inline-asm \
            --disable-stripping \
            --disable-programs \
            --disable-doc \
            --disable-all \
            --enable-avcodec \
            --enable-avformat \
            --enable-avfilter \
            --enable-avutil \
            --enable-swscale \
            --enable-swresample \
            --enable-demuxer=mpegts,mov,mp4,image2 \
            --enable-muxer=mp4,image2 \
            --enable-decoder=h264,hevc,aac \
            --enable-encoder=mjpeg,aac \
            --enable-protocol=file \
            --enable-filter=scale,null \
            --extra-cflags="-O3"

          # 步骤 B: 编译全部静态库 (.a)
          emmake make -j$(nproc)

          # 步骤 C: 自动提取 fftools 下除 ffplay/ffprobe 外的所有源文件进行链接
          mkdir -p ../dist
          FFTOOLS_SRCS=$(ls fftools/*.c | grep -v 'ffplay' | grep -v 'ffprobe' | grep -v 'ffescape')

          emcc -O3 \
            -I. -I./fftools \
            $FFTOOLS_SRCS \
            libavfilter/libavfilter.a \
            libavformat/libavformat.a \
            libavcodec/libavcodec.a \
            libswscale/libswscale.a \
            libswresample/libswresample.a \
            libavutil/libavutil.a \
            -s WASM=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s EXPORTED_RUNTIME_METHODS='["FS","callMain","stringToUTF8","UTF8ToString","cwrap","getValue","setValue"]' \
            -s EXPORT_ES6=1 \
            -s MODULARIZE=1 \
            -s INVOKE_RUN=0 \
            -s EXIT_RUNTIME=1 \
            -o ../dist/ffmpeg-core.js

      # 4. 打包产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-core-mini
          path: dist/
